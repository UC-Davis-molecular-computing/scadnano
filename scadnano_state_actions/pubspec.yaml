name: scadnano_state_actions
description: State types, actions, and serializers for scadnano - extracted to a separate package to optimize built_value code generation caching.

environment:
  sdk: '>=3.11.0 <4.0.0'   # see issue #1104; must match the root pubspec

resolution: workspace

dependencies:
  built_value: ^8.12.6
  built_collection: ^5.1.1
  collection: ^1.19.1
  color: ^3.0.0
  platform_detect: ^2.1.6
  quiver: ^3.2.2
  spreadsheet_decoder: ^2.3.0

dev_dependencies:
  build_runner: ^2.15.1
  build_web_compilers: ^4.8.5
  built_value_generator: ^8.12.5
