name: scadnano_view_middleware
description: A web-based scriptable DNA design tool inspired by cadnano (see https://cadnano.org/ for original cadnano developed by Shawn Douglas).
#homepage: https://scadnano.org
#author: David Doty <doty@ucdavis.edu>

environment:
  # 3.11.0 floor: build_daemon 4.1.3 requires it, and we need 4.1.3 so that the
  # locked build_daemon matches the one a freshly activated `webdev` resolves.
  # See issue #1104. `test` 1.31.1 independently requires >=3.10.0.
  sdk: '>=3.11.0 <4.0.0'

workspace:
  - scadnano_state_actions
  - scadnano_reducers

dependencies:
  scadnano_state_actions:
    path: scadnano_state_actions
  scadnano_reducers:
    path: scadnano_reducers
  built_value: ^8.12.6
  built_collection: ^5.1.1
  collection: ^1.19.1
  color: ^3.0.0
  http: ^1.6.0
  meta: ^1.19.0
  quiver: ^3.2.2
  path: ^1.9.1
  platform_detect: ^2.1.6
  react: ^7.3.2
  redux: ^5.0.0
  over_react: ^5.7.0
  spreadsheet_decoder: ^2.3.0
  # xml is held at 6.x by spreadsheet_decoder, which declares xml ^6.5.0 as of 2.3.0 (latest).
  xml: ^6.6.1
  # test is held at 1.31.1 by the analyzer cap below: 1.31.2 requires analyzer >=13.0.0.
  test: ^1.31.1

dev_dependencies:
  # Capped by over_react, which declares analyzer '>=5.13.0 <11.0.0' as of 5.7.0 (latest).
  # Raising this is a no-op until Workiva relaxes it; it is also what holds build_runner at
  # 2.15.x (2.16.0 needs analyzer >=13.3.0), built_value_generator at 8.12.5 (8.12.6 needs
  # analyzer ^13.0.0), and build_test at 3.5.x (3.5.19 pins build_runner 2.16.0).
  # See issue #1029 and https://github.com/Workiva/over_react/issues/981.
  analyzer: '>=10.0.0 <11.0.0'
  build_runner: ^2.15.1
  build_test: ^3.5.16
  # build_web_compilers 4.8.1+ and webdev 4.0.0 (via dwds 27.1.2) both require Dart SDK
  # >=3.13.0-107.0.dev; latest stable Dart is 3.12.2. Revisit when 3.13 goes stable.
  build_web_compilers: ^4.8.0
  built_value_generator: ^8.12.5
  melos: ^8.3.0
  over_react_test: ^3.0.4
  redux_dev_tools: ^0.7.0
  webdev: ^3.8.1

melos:
  scripts:
    generate:
      description: Build generated .g.dart files in sub-packages
      exec: dart run build_runner build
      packageFilters:
        dependsOn: built_value_generator
    watch:
      description: Watch and rebuild .g.dart files in sub-packages
      exec: dart run build_runner watch
      packageFilters:
        dependsOn: built_value_generator
    serve:
      description: Run webdev serve for the web app
      # `dart run webdev`, not a globally activated `webdev`: see issue #1104
      run: dart run webdev serve
