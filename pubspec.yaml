name: scadnano
description: A web-based scriptable DNA design tool inspired by cadnano (see https://cadnano.org/ for original cadnano developed by Shawn Douglas).
#homepage: https://scadnano.org
#author: David Doty <doty@ucdavis.edu>

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  built_value: ^8.9.0
  built_collection: ^5.1.1
  collection: ^1.15.0-nullsafety.4
  color: ^3.0.0
  dnd: ^2.0.1
  http: ^1.2.2
  meta: ^1.15.0
  quiver: ^3.2.2
  path: ^1.8.3
  platform_detect: ^2.1.0
  react: ^7.1.3
  redux: ^5.0.0
  over_react: ^5.4.0
  spreadsheet_decoder: ^2.2.0
  test: ^1.25.8
  xml: ^6.3.0

dev_dependencies:
  analyzer: ^6.4.1  # Version that works with test_html_builder without macros issues
  build_runner: ^2.0.0
  build_test: ^2.2.3
  build_web_compilers: ^4.3.0
  built_value_generator: ^8.9.0
  over_react_test: ^3.0.0
  redux_dev_tools: ^0.7.0
  test_html_builder: ^3.0.12
