name: build executables

on:
  push:
    tags:
      - 'v*'
    branches:
      - dev

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            npm_command: npm run build:win
            artifact_glob: scadnano-win-*.exe
          # Uncomment to also build Linux (AppImage/deb/rpm):
          # - os: ubuntu-latest
          #   npm_command: npm run build:lin
          #   artifact_glob: scadnano-linux-*.*
          # Uncomment to also build macOS (dmg):
          # - os: macos-latest
          #   npm_command: npm run build:mac
          #   artifact_glob: scadnano-mac-*.*
    runs-on: ${{ matrix.os }}
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: standalone/package-lock.json

      - name: Setup Dart SDK
        uses: ./.github/actions/setup-dart

      - name: Cache Dart pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('standalone/package-lock.json') }}
          restore-keys: ${{ runner.os }}-electron-

      # ImageMagick is pre-installed on windows-latest runners.
      # Uncomment when enabling Linux:
      # - name: Install ImageMagick (Linux)
      #   if: matrix.os == 'ubuntu-latest'
      #   run: sudo apt-get update && sudo apt-get install -y imagemagick libfuse2
      # Uncomment when enabling macOS:
      # - name: Install ImageMagick (macOS)
      #   if: matrix.os == 'macos-latest'
      #   run: brew install imagemagick

      - name: Install npm dependencies
        working-directory: ./standalone
        run: npm ci

      - name: Generate icons
        working-directory: ./standalone
        shell: bash
        run: ./generate-icons.sh ../web/images/origami-icon-thin-seam.png

      - name: Build
        working-directory: ./standalone
        shell: bash
        run: ${{ matrix.npm_command }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: build-${{ matrix.os }}
          path: standalone/dist/${{ matrix.artifact_glob }}
          retention-days: 1

  release:
    name: Publish release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: ./release-files

      - name: Publish to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          FILES=$(find ./release-files -type f)
          echo "Files to upload:"
          echo "$FILES"

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            # Tagged release (e.g. v0.19.15): preserve forever, attach exes to the release.
            TAG="$GITHUB_REF_NAME"
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release $TAG exists; uploading executables with --clobber."
              gh release upload "$TAG" $FILES --clobber --repo "$GITHUB_REPOSITORY"
            else
              echo "Creating release $TAG."
              gh release create "$TAG" \
                --title "$TAG" \
                --notes "Automated build for $TAG (commit $GITHUB_SHA)." \
                --target "$GITHUB_SHA" \
                --repo "$GITHUB_REPOSITORY" \
                $FILES
            fi
          else
            # Rolling dev prerelease: overwrite each push.
            TAG="dev-latest"
            echo "Refreshing rolling prerelease $TAG."
            gh release delete "$TAG" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
            gh release create "$TAG" \
              --title "Latest dev build" \
              --notes "Rolling build from dev branch (commit $GITHUB_SHA). This release is overwritten on every push to dev." \
              --target "$GITHUB_SHA" \
              --prerelease \
              --repo "$GITHUB_REPOSITORY" \
              $FILES
          fi
