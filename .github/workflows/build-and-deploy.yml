name: build and deploy

# This workflow builds the web app, the Electron executables, and handles all
# deployments/releases. It runs on every push to `dev`, every push to `main`, and every
# push of a `v*` tag.
#
# Jobs and their trigger conditions:
#   1. version-guard          — only on push to main. Reads CURRENT_VERSION from
#                               scadnano_state_actions/lib/src/constants.dart and FAILS RED if
#                               the version was not bumped (i.e. tag v$VERSION already exists at
#                               a different commit). Everything else on the main path depends on
#                               it, so an un-bumped version costs ~30 s instead of a 45-minute
#                               matrix build. It also computes the previous release tag, used
#                               below to build the commit list.
#   2. build-web-app          — always. Compiles the Dart/webdev web app ONCE and uploads
#                               the result (build/) as an artifact shared with every
#                               downstream job, so Dart setup + compile is not repeated.
#   3. deploy-gh-pages-dev    — only on push to dev. Downloads the web-build artifact and
#                               publishes it to the `dev/` subdir of the gh-pages branch
#                               (→ https://scadnano.org/dev/).
#   4. deploy-gh-pages-main   — only on push to main. Downloads the web-build artifact
#                               and publishes it to the root of the gh-pages branch
#                               (→ https://scadnano.org/).  NOTE: as of 2026-04-14 we
#                               no longer create a per-version `v$VERSION/` subdir —
#                               accumulated versioned builds were pushing the Pages
#                               artifact past GitHub's 1 GB limit.
#   5. build-executables      — always. Matrix build (windows/ubuntu/macos) that downloads
#                               the web-build artifact and packages it via electron-builder
#                               into platform-specific executables (.exe / .dmg /
#                               .AppImage / .deb / .rpm), uploaded as per-OS artifacts.
#   6. release                — always. Downloads the per-OS executable artifacts and
#                               attaches them to a GitHub release, with different behavior
#                               depending on the trigger:
#                                 • push to dev  → rolling prerelease `dev-latest`,
#                                                  deleted + recreated on every push.
#                                 • push to main → creates the tag v$VERSION at the merge
#                                                  commit and the release `v$VERSION`, titled
#                                                  "TODO: edit release notes for v$VERSION"
#                                                  (a deliberate placeholder), whose body lists
#                                                  every commit since the previous release,
#                                                  with the executables attached.
#                                 • push of v* tag → uploads executables to the release that
#                                                    already exists for that tag; errors if
#                                                    there is none.
#
# Dependency graph:
#   version-guard (if main) ── build-web-app ─┬─ deploy-gh-pages-dev  (if dev)
#                                             ├─ deploy-gh-pages-main (if main)
#                                             └─ build-executables ── release
#
# INVARIANT: every push to main is a release. If CURRENT_VERSION in
# scadnano_state_actions/lib/src/constants.dart was not bumped, this workflow FAILS (red X) on
# purpose, and nothing is tagged, released, or deployed to https://scadnano.org.
#
# NEVER substitute a personal access token (PAT) for GITHUB_TOKEN anywhere in this file.
# Actions taken with GITHUB_TOKEN do not trigger other workflows, and three things depend on that:
#   - the tag v$VERSION created below does NOT re-trigger this workflow via its `tags: v*` filter;
#   - the release created below does NOT trigger changelog.yml, which is correct, because at
#     creation time its title is still the "TODO" placeholder;
#   - the CHANGELOG.md commit that changelog.yml pushes to main does NOT re-trigger this workflow.

on:
  push:
    branches:
      - dev
      - main
    tags:
      - 'v*'
  # Lets this workflow be run by hand from the Actions tab. Without it the only way to exercise
  # a change to this file is to merge it, which is how a broken build reached dev unnoticed.
  # Dispatching from main takes the release path, so it re-runs the version guard (which passes
  # only if the tag for the current version does not already exist elsewhere); dispatching from
  # dev just rebuilds and refreshes the dev-latest prerelease.
  workflow_dispatch:

# Serialize ALL runs of this workflow, deliberately NOT keyed on the ref. The dev and main
# deployments both push to the gh-pages branch, so two of them must never run at once; this used
# to be maintained by hand (see CONTRIBUTING.md) and is now enforced here. Queued, not cancelled:
# every push to main must produce (or loudly fail to produce) a release.
# `queue: max` rather than the default `queue: single`, under which only ONE run may be pending
# and a third run silently cancels the pending one — for the sole creator of releases that would
# mean a lost release with no red X.
concurrency:
  group: build-and-deploy
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  version-guard:
    name: Check version bump
    # Only pushes to main are releases, but this job deliberately has NO job-level `if:`. It
    # always runs and, off main, every step is skipped so it succeeds having done nothing.
    #
    # That is load-bearing. A SKIPPED job propagates "skipped" transitively to everything that
    # needs it, directly or not -- and a status-check function on an intermediate job rescues
    # only that job, not its dependents. When this job was skipped on dev, `build-web-app` ran
    # (it had `!cancelled()`) and then deploy-gh-pages-dev, build-executables and release all
    # skipped anyway, so pushes to dev silently stopped deploying. Keeping this job always
    # successful means no skip ever enters the graph, and every downstream job can use the
    # plain implicit success().
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # gh CLI reads this; do NOT replace with a PAT
    outputs:
      version: ${{ steps.version.outputs.version }}
      create_release: ${{ steps.guard.outputs.create_release }}
      prev_ref: ${{ steps.prev.outputs.prev_ref }}
    steps:
      - name: Checkout
        if: github.ref == 'refs/heads/main'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history + all tags, needed by the guard and by `git log`

      - name: Extract version from scadnano_state_actions/lib/src/constants.dart
        if: github.ref == 'refs/heads/main'
        id: version
        run: |
          version=$(sed -nE 's/^const String CURRENT_VERSION = "([^"]+)";.*$/\1/p' \
            scadnano_state_actions/lib/src/constants.dart | head -1)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=scadnano_state_actions/lib/src/constants.dart::could not extract semantic version from the CURRENT_VERSION line (got: '$version')"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Fail loudly if version was not bumped (unless this is a re-run)
        if: github.ref == 'refs/heads/main'
        id: guard
        run: |
          version='${{ steps.version.outputs.version }}'
          if git rev-parse -q --verify "refs/tags/v$version^{commit}" > /dev/null; then
            tag_commit=$(git rev-parse "refs/tags/v$version^{commit}")
            if [ "$tag_commit" = "$GITHUB_SHA" ]; then
              echo "Tag v$version already exists at this exact commit: re-run of a partially failed workflow. Skipping release creation."
              echo "create_release=false" >> "$GITHUB_OUTPUT"
            else
              echo "::error file=scadnano_state_actions/lib/src/constants.dart::Tag v$version already exists (at $tag_commit) but this push is $GITHUB_SHA. CURRENT_VERSION in scadnano_state_actions/lib/src/constants.dart was not bumped before merging to main. Bump it on dev and merge dev to main again (see CONTRIBUTING.md); this red X is the intended reminder."
              exit 1
            fi
          else
            echo "create_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine previous release tag
        if: github.ref == 'refs/heads/main'
        id: prev
        run: |
          version='${{ steps.version.outputs.version }}'
          # The network call is its OWN assignment so that `set -e` (the default shell here is
          # `bash -e {0}`) sees a nonzero exit and fails the step. Do NOT fold it back into the
          # pipeline below: `head -1` as the last stage makes the pipeline status always 0, so a
          # failing `gh release list` would be indistinguishable from "no previous release".
          # `gh release list` returns newest-first.
          releases=$(gh release list --exclude-drafts --exclude-pre-releases \
            --limit 50 --json tagName --jq '.[].tagName')

          # Newest published release whose tag looks like v<semver>, excluding the release this
          # run creates (which matters on re-runs).
          #   --exclude-pre-releases  drops the rolling `dev-latest` prerelease.
          #   the ^v[0-9]+... filter  drops the legacy floating tag `latest`, a NON-prerelease
          #                           release left over from the archived automatic-release
          #                           action, which would otherwise be picked as the previous
          #                           release and produce an empty or wrong commit list.
          # `|| true` is safe here: this pipeline is purely local, and grep exits 1 on no match.
          prev_ref=$(printf '%s\n' "$releases" \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | grep -vx "v$version" \
            | head -1) || true

          # This repo has ~70 vX.Y.Z releases, so an empty prev_ref is never legitimate: it means
          # the query returned something unexpected. Without this check the release job would fall
          # back to range="HEAD" and dump the entire repository history into the release body.
          if [ -z "$prev_ref" ] && git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | grep -q .; then
            echo "::error::Could not determine the previous release tag, but vX.Y.Z tags exist. Refusing to continue, because the release notes would otherwise contain the entire repository history. Check the 'gh release list' output above."
            exit 1
          fi

          echo "Previous release tag: '$prev_ref'"
          echo "prev_ref=$prev_ref" >> "$GITHUB_OUTPUT"

  build-web-app:
    name: Build scadnano web app
    needs: [version-guard]
    # No `if:` needed. version-guard always runs and always succeeds except when the version was
    # not bumped on main, in which case the implicit success() skips this job and, transitively,
    # the gh-pages deploy, the executables and the release — so a push to main with a stale
    # version produces a complete release or produces nothing at all.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Dart SDK
        uses: ./.github/actions/setup-dart

      - name: Cache Dart pub dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Install Dart dependencies
        run: dart pub get

      - name: Build generated files for sub-packages
        run: |
          cd scadnano_state_actions && dart run build_runner build && cd ..
          cd scadnano_reducers && dart run build_runner build && cd ..

      # Deliberately NOT `webdev build`. webdev is installed with `dart pub global activate`,
      # which resolves its own dependencies INDEPENDENTLY of pubspec.lock -- yet the webdev
      # client and the daemon it spawns (which runs on the project's locked build_daemon) have
      # to agree on where the daemon's port file lives. Nothing enforces that.
      #
      # It broke on 2026-08-02: build_daemon 4.1.3 (published 2026-07-29) "put lock and config
      # files under .dart_tool in the workspace by default". A freshly resolved webdev got
      # 4.1.3 and looked there, while the daemon spawned from this project's locked 4.1.1 wrote
      # to the old location, so every build died with `MissingPortFile`. It had been masked
      # until then only because ~/.pub-cache -- including the already-activated webdev -- was
      # being restored from the Actions cache; once dev went 2 months without a build, that
      # cache was evicted and the next run resolved webdev afresh.
      #
      # build_runner does exactly the same work with no daemon and no second, unlocked
      # resolution: build.yaml already sets the release compiler (dart2js) and
      # -DSCADNANO_PROD=true under `release_options`, and `--output web:build` puts the result
      # in build/ just as `webdev build` did. It is also about twice as fast.
      - name: Build web app
        run: dart run build_runner build --release --output web:build

      - name: Upload web build artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: build/
          retention-days: 1

  deploy-gh-pages-dev:
    name: Deploy web app to gh-pages/dev
    needs: build-web-app
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages-repo

      - name: Download web build artifact
        uses: actions/download-artifact@v8
        with:
          name: web-build
          path: gh-pages-repo/dev

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: gh-pages-repo

  deploy-gh-pages-main:
    name: Deploy web app to gh-pages root
    needs: build-web-app
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # NOTE: as of 2026-04-14 we no longer create per-version subdirectories
    # (gh-pages/v0.X.Y/). Accumulated versioned builds had pushed the Pages
    # artifact past GitHub's 1 GB limit. To resurrect the feature, see the
    # commented block for scadnano_older_versions_to_link in
    # scadnano_state_actions/lib/src/constants.dart.
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages-repo

      - name: Download web build artifact
        uses: actions/download-artifact@v8
        with:
          name: web-build
          path: /tmp/scadnano

      - name: Copy build to gh-pages root
        run: cp -r /tmp/scadnano/. gh-pages-repo/

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: gh-pages-repo

  build-executables:
    name: Build executable on ${{ matrix.os }}
    needs: build-web-app
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            npm_command: npm run build:electron:win
            artifact_glob: scadnano-win-*.exe
          - os: ubuntu-latest
            npm_command: npm run build:electron:lin
            artifact_glob: scadnano-linux-*.*
          - os: macos-latest
            npm_command: npm run build:electron:mac
            artifact_glob: scadnano-mac.*
    runs-on: ${{ matrix.os }}
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: standalone/package-lock.json

      - name: Cache Electron downloads
        uses: actions/cache@v6
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('standalone/package-lock.json') }}
          restore-keys: ${{ runner.os }}-electron-

      - name: Download web build artifact
        uses: actions/download-artifact@v8
        with:
          name: web-build
          path: build/

      # ImageMagick is pre-installed on windows-latest runners.
      - name: Install Linux build deps
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y imagemagick rpm
      - name: Install macOS build deps
        if: matrix.os == 'macos-latest'
        run: brew install imagemagick

      - name: Install npm dependencies
        working-directory: ./standalone
        run: npm ci

      - name: Generate icons
        working-directory: ./standalone
        shell: bash
        run: bash ./generate-icons.sh ../web/images/origami-icon-thin-seam.png

      - name: Build executable
        working-directory: ./standalone
        shell: bash
        run: ${{ matrix.npm_command }}

      # -------------------------------------------------------------------
      # SignPath code-signing step goes here. Pending approval of SignPath
      # Foundation application at https://about.signpath.io/signing-for-open-source-projects
      # Once approved, SignPath will provide values for the inputs below and
      # you will set SIGNPATH_API_TOKEN as a repo secret.
      #
      # - name: Submit signing request to SignPath
      #   if: matrix.os == 'windows-latest'
      #   uses: signpath/github-action-submit-signing-request@v2
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: <your-signpath-org-id>
      #     project-slug: scadnano
      #     signing-policy-slug: release-signing
      #     github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
      #     wait-for-completion: true
      #     output-artifact-directory: standalone/dist
      # -------------------------------------------------------------------

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.os }}
          path: standalone/dist/${{ matrix.artifact_glob }}
          retention-days: 1

  release:
    name: Publish release
    needs: [build-executables, version-guard]
    # No `if:` needed: version-guard always succeeds off main, so the implicit success() reduces
    # to "the executables built". It also means cancelling the run genuinely aborts the release,
    # which an `always()` here would not have done.
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # do NOT replace with a PAT (see header)
      VERSION: ${{ needs.version-guard.outputs.version }}
      CREATE_RELEASE: ${{ needs.version-guard.outputs.create_release }}
      PREV_REF: ${{ needs.version-guard.outputs.prev_ref }}
    steps:
      - name: Checkout (for the commit list on main)
        if: github.ref == 'refs/heads/main'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}   # pin: main may have moved during the ~40 min build
          fetch-depth: 0           # full history + tags, needed for `git log <prev>..HEAD`

      - name: Download executable artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./release-files
          pattern: build-*

      - name: Publish to GitHub release
        shell: bash
        run: |
          set -euo pipefail

          # $FILES is left unquoted below on purpose: word-splitting is what turns this
          # newline-separated list into separate arguments to gh. No filename contains a space.
          FILES=$(find ./release-files -type f)
          echo "Files to upload:"
          echo "$FILES"

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            # A v* tag pushed by hand. Releases are no longer created here: creation belongs
            # solely to the push-to-main path, which alone runs the version-bump guard and builds
            # the commit list. This branch exists only to rebuild and re-attach the executables.
            TAG="$GITHUB_REF_NAME"
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release $TAG exists; uploading executables with --clobber."
              gh release upload "$TAG" $FILES --clobber --repo "$GITHUB_REPOSITORY"
            else
              echo "::error::No GitHub release exists for tag $TAG. Releases are created only by pushes to main, which read CURRENT_VERSION and create the tag themselves. Merge dev into main instead of pushing a tag by hand (see CONTRIBUTING.md)."
              exit 1
            fi

          elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            # Push to main = a release. version-guard already validated $VERSION, decided
            # whether this is a fresh release or a re-run, and found the previous release tag.
            TAG="v$VERSION"
            if [[ "$CREATE_RELEASE" == "true" ]]; then
              if [ -n "$PREV_REF" ]; then range="$PREV_REF..HEAD"; else range="HEAD"; fi

              # The commit list is built here with `git log` rather than with GitHub's own
              # `gh release create --generate-notes`. Do NOT "simplify" this to --generate-notes:
              # that generator is PR-based only. It lists the titles of merged pull requests and
              # silently omits commits pushed directly to a branch, of which this repo has many.
              # Losing those from the release notes is the regression this was written to avoid.
              #
              # --invert-grep drops the "update CHANGELOG.md for release vX.Y.Z" commits that
              # changelog.yml pushes to main between releases; they are bot noise, not changes.
              # Keep this pattern in sync with commit_summary_template in changelog.yml.
              {
                echo "TODO: describe this release here, then retitle the release to \"$TAG\"."
                echo
                echo "## Commits"
                echo
                git log --format='- %h: %s (%an)' \
                        --invert-grep --grep='^update CHANGELOG\.md for release ' "$range"
              } > "$RUNNER_TEMP/release-notes.md"

              echo "Creating release $TAG."
              gh release create "$TAG" \
                --target "$GITHUB_SHA" \
                --title "TODO: edit release notes for $TAG" \
                --notes-file "$RUNNER_TEMP/release-notes.md" \
                --repo "$GITHUB_REPOSITORY" \
                $FILES
            else
              # version-guard found the tag already pointing at this exact commit: this is a
              # re-run of a partially failed workflow. Do not touch the title or the notes (a
              # maintainer may already have edited them); just re-attach the executables. This
              # is what makes the whole workflow safely re-runnable.
              echo "Release $TAG already exists at this commit (re-run); uploading executables with --clobber."
              gh release upload "$TAG" $FILES --clobber --repo "$GITHUB_REPOSITORY"
            fi

          else
            # Rolling dev prerelease: overwrite on each push.
            TAG="dev-latest"
            echo "Refreshing rolling prerelease $TAG."
            gh release delete "$TAG" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
            gh release create "$TAG" \
              --title "Latest dev build" \
              --notes "Rolling build from dev branch (commit $GITHUB_SHA). This release is overwritten on every push to dev." \
              --target "$GITHUB_SHA" \
              --prerelease \
              --repo "$GITHUB_REPOSITORY" \
              $FILES
          fi
