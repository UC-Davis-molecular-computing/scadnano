name: build and deploy

# This workflow builds the web app, the Electron executables, and handles all
# deployments/releases. It runs on every push to `dev`, every push to `main`, and every
# push of a `v*` tag.
#
# Jobs and their trigger conditions:
#   1. build-web-app          — always. Compiles the Dart/webdev web app ONCE and uploads
#                               the result (build/) as an artifact shared with every
#                               downstream job, so Dart setup + compile is not repeated.
#   2. deploy-gh-pages-dev    — only on push to dev. Downloads the web-build artifact and
#                               publishes it to the `dev/` subdir of the gh-pages branch
#                               (→ https://scadnano.org/dev/).
#   3. deploy-gh-pages-main   — only on push to main. Downloads the web-build artifact,
#                               extracts VERSION from constants.dart, and publishes the
#                               build to BOTH the root of the gh-pages branch
#                               (→ https://scadnano.org/) AND the `v$VERSION/` subdir
#                               (→ https://scadnano.org/v0.20.4/) so old versions remain
#                               accessible.
#   4. build-executables      — always. Matrix build (windows/ubuntu/macos) that downloads
#                               the web-build artifact and packages it via electron-builder
#                               into platform-specific executables (.exe / .dmg /
#                               .AppImage / .deb / .rpm), uploaded as per-OS artifacts.
#   5. release                — always. Downloads the per-OS executable artifacts and
#                               attaches them to a GitHub release, with different behavior
#                               depending on the trigger:
#                                 • push to dev  → rolling prerelease `dev-latest`,
#                                                  deleted + recreated on every push.
#                                 • push to main → creates release `v$VERSION` (tag + title
#                                                  " v$VERSION [TODO: add possible release
#                                                  notes]") with --generate-notes
#                                                  (auto-changelog from previous tag).
#                                                  If release already exists, just
#                                                  re-uploads binaries with --clobber.
#                                 • push of v* tag → uploads binaries to the existing
#                                                    v$VERSION release, or creates it if
#                                                    missing.
#
# Dependency graph:
#   build-web-app ─┬─ deploy-gh-pages-dev  (if dev)
#                  ├─ deploy-gh-pages-main (if main)
#                  └─ build-executables ── release

on:
  push:
    branches:
      - dev
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-web-app:
    name: Build scadnano web app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Dart SDK
        uses: ./.github/actions/setup-dart

      - name: Cache Dart pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Install Dart dependencies
        run: dart pub get

      - name: Build generated files for sub-packages
        run: |
          cd scadnano_state_actions && dart run build_runner build --delete-conflicting-outputs && cd ..
          cd scadnano_reducers && dart run build_runner build --delete-conflicting-outputs && cd ..

      - name: Install webdev
        run: dart pub global activate webdev

      - name: Build web app
        run: dart pub global run webdev build -- --delete-conflicting-outputs

      - name: Upload web build artifact
        uses: actions/upload-artifact@v5
        with:
          name: web-build
          path: build/
          retention-days: 1

  deploy-gh-pages-dev:
    name: Deploy web app to gh-pages/dev
    needs: build-web-app
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: gh-pages-repo

      - name: Download web build artifact
        uses: actions/download-artifact@v5
        with:
          name: web-build
          path: gh-pages-repo/dev

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: gh-pages-repo

  deploy-gh-pages-main:
    name: Deploy web app to gh-pages root and v$VERSION
    needs: build-web-app
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for constants.dart)
        uses: actions/checkout@v5

      - name: Checkout gh-pages branch
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: gh-pages-repo

      - name: Download web build artifact
        uses: actions/download-artifact@v5
        with:
          name: web-build
          path: /tmp/scadnano

      - name: Extract version
        run: echo "VERSION=$(grep 'const String CURRENT_VERSION = ' scadnano_state_actions/lib/src/constants.dart | grep -oP '\d+\.\d+\.\d+')" >> $GITHUB_ENV

      - name: Copy build to gh-pages root and versioned subdir
        run: |
          cp -r /tmp/scadnano/. gh-pages-repo/
          if [ -n "$VERSION" ]; then
            mkdir -p "gh-pages-repo/v$VERSION"
            cp -r /tmp/scadnano/. "gh-pages-repo/v$VERSION/"
          else
            echo "::warning::deploying VERSION skipped because VERSION number could not be found"
          fi

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: gh-pages-repo

  build-executables:
    name: Build executable on ${{ matrix.os }}
    needs: build-web-app
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            npm_command: npm run build:electron:win
            artifact_glob: scadnano-win-*.exe
          - os: ubuntu-latest
            npm_command: npm run build:electron:lin
            artifact_glob: scadnano-linux-*.*
          - os: macos-latest
            npm_command: npm run build:electron:mac
            artifact_glob: scadnano-mac-*.*
    runs-on: ${{ matrix.os }}
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: standalone/package-lock.json

      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('standalone/package-lock.json') }}
          restore-keys: ${{ runner.os }}-electron-

      - name: Download web build artifact
        uses: actions/download-artifact@v5
        with:
          name: web-build
          path: build/

      # ImageMagick is pre-installed on windows-latest runners.
      - name: Install Linux build deps
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y imagemagick rpm
      - name: Install macOS build deps
        if: matrix.os == 'macos-latest'
        run: brew install imagemagick

      - name: Install npm dependencies
        working-directory: ./standalone
        run: npm ci

      - name: Generate icons
        working-directory: ./standalone
        shell: bash
        run: bash ./generate-icons.sh ../web/images/origami-icon-thin-seam.png

      - name: Build executable
        working-directory: ./standalone
        shell: bash
        run: ${{ matrix.npm_command }}

      # -------------------------------------------------------------------
      # SignPath code-signing step goes here. Pending approval of SignPath
      # Foundation application at https://about.signpath.io/signing-for-open-source-projects
      # Once approved, SignPath will provide values for the inputs below and
      # you will set SIGNPATH_API_TOKEN as a repo secret.
      #
      # - name: Submit signing request to SignPath
      #   if: matrix.os == 'windows-latest'
      #   uses: signpath/github-action-submit-signing-request@v1
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: <your-signpath-org-id>
      #     project-slug: scadnano
      #     signing-policy-slug: release-signing
      #     github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
      #     wait-for-completion: true
      #     output-artifact-directory: standalone/dist
      # -------------------------------------------------------------------

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: build-${{ matrix.os }}
          path: standalone/dist/${{ matrix.artifact_glob }}
          retention-days: 1

  release:
    name: Publish release
    needs: build-executables
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for version extraction on main)
        if: github.ref == 'refs/heads/main'
        uses: actions/checkout@v5

      - name: Download executable artifacts
        uses: actions/download-artifact@v5
        with:
          path: ./release-files
          pattern: build-*

      - name: Publish to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          FILES=$(find ./release-files -type f)
          echo "Files to upload:"
          echo "$FILES"

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            # Tagged release (e.g. v0.19.15): preserve forever, attach exes to the release.
            TAG="$GITHUB_REF_NAME"
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release $TAG exists; uploading executables with --clobber."
              gh release upload "$TAG" $FILES --clobber --repo "$GITHUB_REPOSITORY"
            else
              echo "Creating release $TAG."
              gh release create "$TAG" \
                --title "$TAG" \
                --notes "Automated build for $TAG (commit $GITHUB_SHA)." \
                --target "$GITHUB_SHA" \
                --repo "$GITHUB_REPOSITORY" \
                $FILES
            fi
          elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            # Push to main: extract version from constants.dart, create v$VERSION
            # tag/release with auto-generated notes, attach binaries.
            VERSION=$(grep 'const String CURRENT_VERSION = ' scadnano_state_actions/lib/src/constants.dart | grep -oP '\d+\.\d+\.\d+')
            if [[ -z "$VERSION" ]]; then
              echo "ERROR: could not extract version from scadnano_state_actions/lib/src/constants.dart"
              exit 1
            fi
            TAG="v$VERSION"
            TITLE=" $TAG [TODO: add possible release notes]"
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release $TAG already exists; uploading binaries with --clobber."
              gh release upload "$TAG" $FILES --clobber --repo "$GITHUB_REPOSITORY"
            else
              echo "Creating release $TAG."
              gh release create "$TAG" \
                --title "$TITLE" \
                --generate-notes \
                --target "$GITHUB_SHA" \
                --repo "$GITHUB_REPOSITORY" \
                $FILES
            fi
          else
            # Rolling dev prerelease: overwrite each push.
            TAG="dev-latest"
            echo "Refreshing rolling prerelease $TAG."
            gh release delete "$TAG" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
            gh release create "$TAG" \
              --title "Latest dev build" \
              --notes "Rolling build from dev branch (commit $GITHUB_SHA). This release is overwritten on every push to dev." \
              --target "$GITHUB_SHA" \
              --prerelease \
              --repo "$GITHUB_REPOSITORY" \
              $FILES
          fi
