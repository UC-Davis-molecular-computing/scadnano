name: github pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-repo

      - name: Setup Dart SDK
        uses: ./.github/actions/setup-dart

      - name: Install dependencies
        run: dart pub get

      - name: Build generated files for sub-packages
        run: |
          cd scadnano_state_actions && dart run build_runner build --delete-conflicting-outputs && cd ..
          cd scadnano_reducers && dart run build_runner build --delete-conflicting-outputs && cd ..

      - name: Activate webdev
        run: dart pub global activate webdev

      - name: Retrieve version
        run: echo "VERSION=$(cat lib/src/constants.dart | grep 'const String CURRENT_VERSION = .*' | grep -oP '\d+\.\d+\.\d+')" >> $GITHUB_ENV

      - name: Build web app (once)
        run: dart pub global run webdev build -o web:/tmp/scadnano

      - name: Deploy to gh-pages root and versioned directory
        run: |
          cp -r /tmp/scadnano/. gh-pages-repo/
          if [ -n "$VERSION" ]; then
             mkdir -p "gh-pages-repo/v$VERSION"
             cp -r /tmp/scadnano/. "gh-pages-repo/v$VERSION/"
          else
             echo "::warning::deploying VERSION skipped because VERSION number could not be found"
          fi

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: gh-pages-repo
