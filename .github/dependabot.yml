version: 2
updates:
  - package-ecosystem: "pub"
    directory: "/" # Directory of pubspec.yaml
    target-branch: "dev"
    schedule:
      interval: "weekly" # daily, weekly, monthly

  - package-ecosystem: "npm"
    directory: "/standalone" # Directory of package.json
    target-branch: "dev"
    schedule:
      interval: "weekly"

  # Keep the versions of the third-party actions used in .github/workflows (and in the
  # local composite action .github/actions/setup-dart) up to date. Without this they go
  # stale silently, until the Node runtime they run on is retired and the workflows start
  # failing on GitHub's schedule rather than on ours.
  - package-ecosystem: "github-actions"
    # "/" covers .github/workflows plus a root-level action.yml only; dependabot does not
    # recurse into .github/actions, so the local composite action is listed explicitly.
    directories:
      - "/"
      - "/.github/actions/setup-dart"
    # Without this, dependabot opens its PRs against the default branch, main.
    # Every push to main is a release, so such a PR would either be merged
    # without a version bump (failing the release workflow) or have to be
    # retargeted by hand each month. Send them to dev like all other changes.
    target-branch: "dev"
    schedule:
      interval: "monthly"
    groups:
      # one PR for all of them, rather than one PR per action
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "CI"
